<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Subjuntivo o infinitivo</title>
<style>
body{margin:0;font-family:"Century Gothic",Arial,sans-serif;background:#eaf3ff;color:#172033}.wrap{max-width:1050px;margin:auto;padding:24px}.card{background:#fff;border:9px solid #7aa9ef;border-radius:30px;min-height:700px;box-shadow:0 15px 34px #234f9126;overflow:hidden}.top{text-align:center;font-weight:800;font-size:28px;color:#245fbe;padding:24px 24px 8px}.sub{text-align:center;color:#5f6d83;font-size:16px}.progress{text-align:right;padding:8px 32px 12px;color:#64748b}.screen{display:none;padding:32px 40px 46px}.screen.active{display:block}.question{white-space:pre-line;font-size:30px;font-weight:700;line-height:1.5;text-align:center;border:3px solid #d6e6ff;border-radius:20px;padding:28px;min-height:185px;display:flex;align-items:center;justify-content:center}.answerrow{max-width:720px;margin:30px auto 0;display:flex;gap:12px}input{flex:1;font:inherit;font-size:25px;padding:15px 18px;border-radius:14px;border:3px solid #9cc4ff}button{font:inherit;font-weight:700;cursor:pointer;border-radius:14px}.checkbtn{border:0;background:#245fbe;color:#fff;padding:0 26px;font-size:19px}.title{font-size:40px;font-weight:800;text-align:center;margin:10px 0 24px}.goodt{color:#2e9b50}.badt{color:#cf3f4a}.icon{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;margin:0 auto 25px;font-size:66px;font-weight:900}.goodicon{background:#eaf8ef;border:6px solid #2e9b50;color:#2e9b50}.badicon{background:#fff0f2;border:6px solid #cf3f4a;color:#cf3f4a}.box{max-width:850px;margin:18px auto;padding:22px 26px;border-radius:18px;font-size:22px;line-height:1.45;text-align:center}.goodbox{background:#f4fbf6;border:3px solid #9fd2ad}.reason{background:#fbfdff;border:3px solid #c8dcff}.bigbtn{display:block;margin:30px auto 0;padding:15px 40px;border:3px solid;font-size:22px}.continue{border-color:#62b77a;color:#1b6d35;background:#e5f6e9}.retry{border-color:#e58c98;color:#a52738;background:#fff1f2}.done{text-align:center;font-size:36px;font-weight:800;color:#245fbe;margin-top:85px}.score{text-align:center;font-size:60px;font-weight:900;margin:25px 0}@media(max-width:700px){.screen{padding:24px 18px}.question{font-size:23px;min-height:220px}.answerrow{flex-direction:column}.checkbtn{min-height:54px}}
</style></head><body><div class="wrap"><div class="card"><div class="top">Subjuntivo o infinitivo</div><div class="sub">Tecnología • Completa con la forma correcta del verbo.</div><div id="progress" class="progress"></div>
<section id="qScreen" class="screen active"><div id="question" class="question"></div><div class="answerrow"><input id="answer" autocomplete="off" spellcheck="false"><button id="check" class="checkbtn">Comprobar</button></div></section>
<section id="correctScreen" class="screen"><div class="title goodt">¡Correcto!</div><div class="icon goodicon">✓</div><div id="correctSentence" class="box goodbox"></div><div id="correctReason" class="box reason"></div><button id="continue" class="bigbtn continue">Continuar</button></section>
<section id="wrongScreen" class="screen"><div class="title badt">Inténtalo de nuevo</div><div class="icon badicon">×</div><div id="wrongReason" class="box reason"></div><button id="retry" class="bigbtn retry">Intentar otra vez</button></section>
<section id="doneScreen" class="screen"><div class="done">¡Terminaste!</div><div id="score" class="score"></div><button id="restart" class="bigbtn continue">Practicar otra vez</button></section>
</div></div><script>
const originalQuestions=[{"q":"Yo quiero _____ la batería antes de salir. (cargar)","a":["cargar"],"why":"Use the infinitive because the subject of quiero and cargar is the same person: yo."},{"q":"Yo quiero que tú _____ la batería antes de salir. (cargar)","a":["cargues"],"why":"Use the subjunctive because querer + que connects two different subjects: yo and tú."},{"q":"Necesitamos _____ el archivo en la nube. (guardar)","a":["guardar"],"why":"Use the infinitive because nosotros is the subject of both actions."},{"q":"Necesitamos que Marta _____ el archivo en la nube. (guardar)","a":["guarde"],"why":"Use the subjunctive because necesitar + que has a different subject in the second clause."},{"q":"El profesor recomienda _____ una contraseña segura. (usar)","a":["usar"],"why":"Use the infinitive for a general recommendation without a second subject."},{"q":"El profesor recomienda que nosotros _____ una contraseña segura. (usar)","a":["usemos"],"why":"Use the subjunctive because recomendar + que introduces a second subject."},{"q":"Te aconsejo _____ el celular durante el examen. (apagar)","a":["apagar"],"why":"Use the infinitive after aconsejar for a general action without a new subject after que."},{"q":"Te aconsejo que _____ el celular durante el examen. (apagar)","a":["apagues"],"why":"Use the subjunctive because aconsejar + que introduces tú."},{"q":"Ellos esperan _____ una videollamada esta noche. (hacer)","a":["hacer"],"why":"Use the infinitive because ellos perform both actions."},{"q":"Ellos esperan que nosotros _____ una videollamada esta noche. (hacer)","a":["hagamos"],"why":"Use the subjunctive because esperar + que has different subjects."},{"q":"Insisto en _____ el enlace antes de compartirlo. (comprobar)","a":["comprobar"],"why":"Use the infinitive after insistir en when the same subject performs the action."},{"q":"Insisto en que tú _____ el enlace antes de compartirlo. (comprobar)","a":["compruebes"],"why":"Use the subjunctive after insistir en que because there is a new subject, tú."},{"q":"Mi mamá pide _____ el volumen. (bajar)","a":["bajar"],"why":"Use the infinitive when the request is expressed without a second subject after que."},{"q":"Mi mamá pide que yo _____ el volumen. (bajar)","a":["baje"],"why":"Use the subjunctive because pedir + que introduces a second subject."},{"q":"El sitio web permite _____ un perfil privado. (crear)","a":["crear"],"why":"Use the infinitive after permitir when no specific second subject is introduced."},{"q":"La maestra permite que los estudiantes _____ sus archivos. (subir)","a":["suban"],"why":"Use the subjunctive because permitir + que introduces a second subject."},{"q":"Sugiero _____ la captura de pantalla en una carpeta. (guardar)","a":["guardar"],"why":"Use the infinitive for a general suggestion without a new subject."},{"q":"Sugiero que tú _____ la captura de pantalla en una carpeta. (guardar)","a":["guardes"],"why":"Use the subjunctive because sugerir + que introduces tú."},{"q":"Queremos _____ las fotos a la nube. (subir)","a":["subir"],"why":"Use the infinitive because nosotros is the subject of both verbs."},{"q":"Queremos que Ana _____ las fotos a la nube. (subir)","a":["suba"],"why":"Use the subjunctive because querer + que introduces a new subject, Ana."},{"q":"Necesito _____ mi contraseña. (cambiar)","a":["cambiar"],"why":"Use the infinitive because yo performs both actions."},{"q":"Necesito que ustedes _____ sus contraseñas. (cambiar)","a":["cambien"],"why":"Use the subjunctive because necesitar + que introduces ustedes."},{"q":"Recomiendo _____ los ajustes de seguridad. (revisar)","a":["revisar"],"why":"Use the infinitive for a general recommendation."},{"q":"Recomiendo que Carlos _____ los ajustes de seguridad. (revisar)","a":["revise"],"why":"Use the subjunctive because recomendar + que introduces Carlos."},{"q":"Esperamos _____ el archivo antes de la clase. (descargar)","a":["descargar"],"why":"Use the infinitive because nosotros performs both actions."},{"q":"Esperamos que el profesor _____ el archivo antes de la clase. (descargar)","a":["descargue"],"why":"Use the subjunctive because esperar + que introduces el profesor."},{"q":"Te aconsejo _____ las redes sociales con cuidado. (usar)","a":["usar"],"why":"Use the infinitive for general advice without a new subject after que."},{"q":"Te aconsejo que no _____ información privada. (publicar)","a":["publiques"],"why":"Use the subjunctive because aconsejar + que introduces tú."},{"q":"Insistimos en _____ la computadora antes de salir. (apagar)","a":["apagar"],"why":"Use the infinitive because nosotros performs both actions."},{"q":"Insistimos en que Javier _____ la computadora antes de salir. (apagar)","a":["apague"],"why":"Use the subjunctive after insistir en que because Javier is a different subject."},{"q":"Quiero _____ un mensaje de texto a mi mamá. (mandar)","a":["mandar","enviar"],"why":"Use the infinitive because yo performs both actions."},{"q":"Quiero que tú me _____ un mensaje cuando llegues. (mandar)","a":["mandes","envíes"],"why":"Use the subjunctive because querer + que introduces tú."},{"q":"El profesor pide _____ la tarea por el sitio web. (entregar)","a":["entregar"],"why":"Use the infinitive when the instruction is expressed generally without a new subject after que."},{"q":"El profesor pide que nosotros _____ la tarea por el sitio web. (entregar)","a":["entreguemos"],"why":"Use the subjunctive because pedir + que introduces nosotros."},{"q":"La aplicación permite _____ una foto al perfil. (subir)","a":["subir"],"why":"Use the infinitive when no second subject is introduced."},{"q":"La aplicación permite que el usuario _____ una foto al perfil. (subir)","a":["suba"],"why":"Use the subjunctive because permitir + que introduces el usuario."},{"q":"Sugiero _____ el nombre de usuario en un lugar seguro. (anotar)","a":["anotar"],"why":"Use the infinitive for a general suggestion."},{"q":"Sugiero que tú no _____ tu contraseña con nadie. (compartir)","a":["compartas"],"why":"Use the subjunctive because sugerir + que introduces tú."},{"q":"Necesitamos _____ la impresora al Wi-Fi. (conectar)","a":["conectar"],"why":"Use the infinitive because nosotros performs both actions."},{"q":"Necesitamos que el técnico _____ la impresora al Wi-Fi. (conectar)","a":["conecte"],"why":"Use the subjunctive because necesitar + que introduces el técnico."},{"q":"Espero _____ al día con mis mensajes. (estar)","a":["estar"],"why":"Use the infinitive because yo is the subject of both actions."},{"q":"Espero que tú _____ al día con tus mensajes. (estar)","a":["estés"],"why":"Use the subjunctive because esperar + que introduces tú."},{"q":"Recomendamos _____ una copia del archivo. (hacer)","a":["hacer"],"why":"Use the infinitive for a general recommendation."},{"q":"Recomendamos que ustedes _____ una copia del archivo. (hacer)","a":["hagan"],"why":"Use the subjunctive because recomendar + que introduces ustedes."},{"q":"Mi papá quiere _____ una cuenta nueva. (crear)","a":["crear"],"why":"Use the infinitive because mi papá performs both actions."},{"q":"Mi papá quiere que yo _____ una cuenta nueva. (crear)","a":["cree"],"why":"Use the subjunctive because querer + que introduces yo."},{"q":"Aconsejamos _____ los archivos importantes en la nube. (guardar)","a":["guardar"],"why":"Use the infinitive for general advice."},{"q":"Aconsejamos que Marta _____ los archivos importantes en la nube. (guardar)","a":["guarde"],"why":"Use the subjunctive because aconsejar + que introduces Marta."},{"q":"Insisto en _____ clic en el enlace correcto. (hacer)","a":["hacer"],"why":"Use the infinitive after insistir en when the same subject performs the action."},{"q":"Insisto en que tú _____ clic en el enlace correcto. (hacer)","a":["hagas"],"why":"Use the subjunctive after insistir en que because tú is a different subject."}];let questions=[],i=0,correct=0;const q=document.getElementById('question'),ans=document.getElementById('answer');
function norm(s){return s.trim().toLocaleLowerCase('es').normalize('NFC')}function shuffle(a){const c=[...a];for(let k=c.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[c[k],c[j]]=[c[j],c[k]]}return c}function show(id){document.querySelectorAll('.screen').forEach(x=>x.classList.remove('active'));document.getElementById(id).classList.add('active')}function render(){const item=questions[i];document.getElementById('progress').textContent=`Pregunta ${i+1} de ${questions.length}`;q.textContent=item.q;ans.value='';ans.focus();show('qScreen')}function check(){const item=questions[i],r=norm(ans.value);if(!r)return;if(item.a.some(x=>norm(x)===r)){correct++;document.getElementById('correctSentence').textContent=item.q.replace('_____',item.a[0]);document.getElementById('correctReason').textContent=item.why;show('correctScreen')}else{document.getElementById('wrongReason').textContent=item.why;show('wrongScreen')}}document.getElementById('check').onclick=check;ans.addEventListener('keydown',e=>{if(e.key==='Enter')check()});document.getElementById('retry').onclick=render;document.getElementById('continue').onclick=()=>{i++;if(i>=questions.length)finish();else render()};document.getElementById('restart').onclick=start;function finish(){document.getElementById('progress').textContent='';document.getElementById('score').textContent=`${correct} / ${questions.length}`;show('doneScreen')}function start(){questions=shuffle(originalQuestions);i=0;correct=0;render()}start();
</script></body></html>
